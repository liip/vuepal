# nodePage has no __typename, nodeArticle has one.

# All fragments + __typename via inline on Node.
# items type: (NodePageFragment & { __typename } | NodeArticleFragment | object) | null
query entityQueryAllFragments($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      ... on Node {
        __typename
      }
      ...nodePage
      ...nodeArticle
    }
  }
}

# Single fragment without __typename.
# nodePage does not include __typename, so the generated type won't have it
# unless we add it separately.
# items type: (NodePageFragment | object) | null
query entityQuerySingleFragmentNoTypename($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      ...nodePage
    }
  }
}

# Single fragment that includes __typename.
# items type: (NodeArticleFragment | object) | null
query entityQuerySingleFragmentWithTypename($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      ...nodeArticle
    }
  }
}

# __typename directly in items, no fragments at all.
# items type: ({ __typename } | null)
query entityQueryTypenameOnly($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      __typename
    }
  }
}

# Only inline fragments, no named fragments.
# items type: ({ __typename, title } | { __typename, uuid } | object) | null
query entityQueryInlineOnly($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      ... on NodePage {
        __typename
        title
      }
      ... on NodeArticle {
        __typename
        uuid
      }
    }
  }
}

# Mix: fragment without __typename (nodePage) combined with fragment
# that has __typename (nodeArticle). No inline __typename.
# items type: (NodePageFragment | NodeArticleFragment | object) | null
query entityQueryMixedTypename($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      ...nodePage
      ...nodeArticle
    }
  }
}

# __typename added inline + fragment without __typename.
# items type: (NodePageFragment & { __typename } | object) | null
query entityQueryTypenameInlineWithFragment($limit: Int) {
  entityQuery(entityType: NODE, limit: $limit) {
    items {
      ... on Node {
        __typename
      }
      ...nodePage
    }
  }
}
