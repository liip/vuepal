# One host for Nuxt and Drupal, like a real project behind a shared ingress:
# - files that exist in the Drupal docroot are served directly,
# - Drupal paths (GraphQL, login, admin, node edit forms, ...) go to PHP,
# - everything else goes to Nuxt on port 3000 in the web container.
#
# Based on the config ddev generates for Drupal, without ddev's signature
# comment, so that ddev does not overwrite this file. Do not add that comment
# anywhere in this file, ddev looks for it as plain text.

map $http_upgrade $vuepal_connection_upgrade {
    default upgrade;
    '' '';
}

map $http_x_forwarded_proto $vuepal_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

upstream vuepal_nuxt {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    root /var/www/html/drupal/web;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    index index.php;
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    location / {
        absolute_redirect off;
        try_files $uri @nuxt;
    }

    # Drupal paths, with or without a language prefix. Drupal generates its CSS
    # and JS aggregates on request, under the language prefix. "themes" is not
    # listed, the playground serves files from public/themes.
    location ~ ^/((de|en)/)?(graphql|user|admin|batch|system|session|contextual|sites|core|modules|libraries|node/add|node/\d+/(edit|delete|revisions|translations))(/|$) {
        absolute_redirect off;
        try_files $uri /index.php?$query_string;
    }

    # Nuxt assets and the dev server's websocket. ^~ keeps the regex locations
    # for static files below from sending them to Drupal.
    location ^~ /_nuxt/ {
        try_files /dev/null @nuxt;
    }

    location @nuxt {
        proxy_pass http://vuepal_nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vuepal_connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $vuepal_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    location @rewrite {
        rewrite ^ /index.php;
    }

    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
    }

    location ~* /\.(?!well-known\/) {
        deny all;
    }

    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    location ^~ /system/files/ {
        try_files $uri @rewrite;
    }

    # Static files: from the Drupal docroot if they exist, else from Nuxt (for
    # example the files in playground/public).
    location ~* \.(jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|webp|htc|js|css)$ {
        try_files $uri @nuxt;
        log_not_found off;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
